name: Diagnose TanStack Build

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build site
        run: bun run build

      - name: Inspect build output
        run: |
          echo "=== Root files ==="
          ls -la
          echo "=== dist files ==="
          if [ -d dist ]; then
            find dist -maxdepth 4 -type f | sort
          else
            echo "No dist directory"
          fi
          echo "=== .output files ==="
          if [ -d .output ]; then
            find .output -maxdepth 3 -type f | sort
          else
            echo "No .output directory"
          fi
