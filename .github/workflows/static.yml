name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build site
        run: bun run build

      - name: Inspect generated asset paths
        run: |
          echo "=== Generated files ==="
          find .output/public -maxdepth 4 -type f | sort

          echo "=== Hero image references ==="
          grep -R -n "hero-DbcUb8pm.jpg" .output/public || true

          echo "=== HTML asset references ==="
          grep -oE '(src|href)="[^"]+"' .output/public/index.html | head -60 || true

          echo "=== CSS asset URLs ==="
          grep -R -nE 'url\([^)]*\)' .output/public/assets --include='*.css' | head -60 || true

      - name: Publish Lovable image assets as static files
        run: |
          mkdir -p .output/public
          cp src/assets/greptun-logo.png .output/public/greptun-logo.png
          cp src/assets/lisa-artwork.png .output/public/lisa-artwork.png
          cp src/assets/lisa-logo.png .output/public/lisa-logo.png
          python3 - <<'PY'
          from pathlib import Path
          root = Path(".output/public")
          replacements = {
              "/__l5e/assets-v1/2df16a3e-f820-468f-8c5a-9253588cf275/greptun-logo.png": "/greptun-logo.png",
              "/__l5e/assets-v1/726ab1ba-08d7-49f7-a4fd-ed6d559784d2/lisa-artwork.png": "/lisa-artwork.png",
          }
          # Read the asset metadata to locate the LISA logo's generated URL.
          metadata = Path("src/assets/lisa-logo.png.asset.json")
          if metadata.exists():
              import json
              url = json.loads(metadata.read_text())["url"]
              replacements[url] = "/lisa-logo.png"
          for path in root.rglob("*"):
              if path.is_file() and path.suffix in {".html", ".js", ".css"}:
                  text = path.read_text(encoding="utf-8")
                  for source, target in replacements.items():
                      text = text.replace(source, target)
                  path.write_text(text, encoding="utf-8")
          PY

      - name: Normalize asset URLs for GitHub Pages
        run: |
          # The custom domain serves the site from the domain root.
          python3 - <<'PY'
          from pathlib import Path
          root = Path(".output/public")
          for path in root.rglob("*"):
              if path.is_file() and path.suffix in {".html", ".js", ".css"}:
                  text = path.read_text(encoding="utf-8")
                  path.write_text(text, encoding="utf-8")
          PY

      - name: Publish search engine files
        run: |
          cp public/robots.txt .output/public/robots.txt
          cp public/sitemap.xml .output/public/sitemap.xml

      - name: Verify static output
        run: |
          test -f .output/public/index.html
          test -d .output/public/assets
          test -f .output/public/robots.txt
          test -f .output/public/sitemap.xml
          grep -q 'https://greptun.com/' .output/public/index.html
          grep -q 'https://greptun.com/sitemap.xml' .output/public/robots.txt

      - name: Add 404 page
        run: cp .output/public/index.html .output/public/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
