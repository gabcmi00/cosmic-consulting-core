
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build site
        run: bun run build

      - name: Inspect generated asset paths
        run: |
          echo "=== Generated files ==="
          find .output/public -maxdepth 4 -type f | sort

          echo "=== Hero image references ==="
          grep -R -n "hero-DbcUb8pm.jpg" .output/public || true

          echo "=== HTML asset references ==="
          grep -oE '(src|href)="[^"]+"' .output/public/index.html | head -60 || true

          echo "=== CSS asset URLs ==="
          grep -R -nE 'url\([^)]*\)' .output/public/assets --include='*.css' | head -60 || true

      - name: Verify static output
        run: |
          test -f .output/public/index.html
          test -d .output/public/assets

      - name: Add 404 page
        run: cp .output/public/index.html .output/public/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
